<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><meta name="referrer" content="no-referrer"><title>Nakit — Güvenli Finans Hesabım</title><meta name="description" content="iPhone ve MacBook için hesabına özel, senkronize finans takibi."><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#243b5c;font:16px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}main{max-width:410px;margin:18vh auto;padding:28px}.brand{font-size:28px;font-weight:600;letter-spacing:-1px}h1{font-size:22px;font-weight:500;margin-top:35px}p{color:#718099;font-size:14px}a{display:block;text-align:center;margin-top:25px;padding:14px 20px;border:1px solid #e1c9b5;border-radius:13px;background:#f7e5d6;color:#243b5c;text-decoration:none}small{display:block;margin-top:20px;color:#8390a1;font-size:12px}</style></head><body><main><div class="brand">nakit.</div><h1>Özel hesabın açılıyor.</h1><p>İki cihaz, aynı kayıtlar. iPhone ve MacBook'ta aynı ChatGPT hesabınla giriş yap.</p><a href="https://nakit-premium-finans.kdrolmz.chatgpt.site/" rel="noreferrer">Güvenli uygulamamı aç</a><small>Finans kayıtların GitHub'da tutulmaz. Bu dosya, ortak güvenli uygulamayı açar; çevrimdışı kayıt oluşturmaz.</small></main><script>
(()=>{let old=null;try{const raw=localStorage.getItem('nakit-premium-v2');if(raw){const parsed=JSON.parse(raw);if(parsed.version===2&&!parsed.demo&&parsed.records?.length)old=raw;}}catch{}
if(!old){location.replace('https://nakit-premium-finans.kdrolmz.chatgpt.site/');return;}
document.querySelector('h1').textContent='Eski kayıtlarını koruyalım.';
document.querySelector('p').textContent='Bu cihazda eski yerel kayıtlar var. Önce yedeğini indir, sonra güvenli uygulamada Ayarlar → Yedek içe aktar bölümünden ekle.';
const button=document.createElement('button');button.textContent='Eski kayıtlarımı indir';button.style.cssText='width:100%;padding:14px;border:1px solid #d8e0eb;border-radius:12px;background:white;color:#243b5c;font:inherit';
button.onclick=()=>{const url=URL.createObjectURL(new Blob([old],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='nakit-eski-kayitlar.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
document.querySelector('main').insertBefore(button,document.querySelector('main>a'));
})();
</script></body></html>
